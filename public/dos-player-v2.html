<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Playton DOS</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:; worker-src 'self' blob:; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="dos-runtime/js-dos.css"><style>html,body,#dos{margin:0;width:100%;height:100%;overflow:hidden;background:#101215}body{font:14px system-ui;color:white}#message{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}</style></head><body><div id="dos"></div><div id="message">Запуск DOSBox…</div><script src="dos-runtime/js-dos.js"></script><script>
let player=null;const origin=location.origin;const tell=(status)=>parent.postMessage({type:'playton-dos-status',status},origin);
addEventListener('message',async e=>{if(e.source!==parent||e.origin!==origin||e.data?.type!=='playton-dos-start'||player)return;try{const data=e.data;const config='[dosbox]\nmemsize=16\n[cpu]\ncore=auto\ncycles=auto\n[autoexec]\nmount c .\nc:\n'+(data.mode==='doom'?'DOOM2.EXE -iwad DOOM2.WAD\n':'echo Playton DOS Runtime ready\ndir\n');player=Dos(document.getElementById('dos'),{dosboxConf:config,initFs:data.files||[],pathPrefix:new URL('dos-runtime/emulators/',location.href).href,lang:'en',backend:'dosbox',backendLocked:true,workerThread:true,autoStart:true,renderAspect:'4/3',imageRendering:'pixelated',runInBackground:false,autoSave:false,quickSave:false,fsChanges:{local:false},onEvent:(event)=>{if(event==='emu-ready')tell('Эмулятор загружен');if(event==='ci-ready')tell('DOS запущен')}});player.setNoCloud(true);document.getElementById('message').remove();}catch(err){tell('Ошибка запуска: '+String(err));document.getElementById('message').textContent=String(err)}});
addEventListener('pagehide',()=>{player?.stop?.()});tell('Готов к запуску');
</script></body></html>
